<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karaz Tiaras - Affordable Luxury</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      color: #333;
      background-color: #f9f9f9;
    }
    header {
      background-color: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 100;
    }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #d4af37;
    }
    nav ul {
      list-style: none;
      display: flex;
      gap: 2rem;
    }
    nav a {
      text-decoration: none;
      color: #333;
      transition: color 0.3s;
    }
    nav a:hover { color: #d4af37; }
    .hero {
      background: linear-gradient(to right, #f9f9f9, #e0e0e0);
      height: 90vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      margin-top: 80px;
    }
    .hero h1 {
      font-size: 3rem;
      color: #d4af37;
    }
    .cta-button {
      background-color: #d4af37;
      color: #fff;
      padding: 0.75rem 1.5rem;
      text-decoration: none;
      border-radius: 5px;
      transition: background 0.3s;
    }
    .cta-button:hover { background-color: #b8860b; }
    footer {
      background-color: #333;
      color: #fff;
      text-align: center;
      padding: 1rem;
    }
    footer a {
      color: #d4af37;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <div class="logo">Karaz Tiaras</div>
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#gallery">Shop</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section id="home" class="hero">
    <h1>Karaz Tiaras</h1>
    <p>Affordable luxury for brides and little princesses ✨</p>
    <a href="#gallery" class="cta-button">Shop Now</a>
  </section>

  <footer id="contact">
    <p>&copy; 2026 Karaz Tiaras | <a href="https://instagram.com/karaztiaras">Instagram</a></p>
  </footer>
</body>
</html>
